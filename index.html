<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Laboratorio Strategy PaqueteYa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Tema claro por defecto; el estudiante puede cambiar a oscuro con la luna. Concepto: tablero blanco de laboratorio; cada misión tiene su propio color (rojo, morado, verde, ámbar, azul). */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --soft:#F4F5F7; --ink:#1F2430; --muted:#5B6270; --line:#DDE0E6;
  --c1:#D7263D; --c1s:#FDECEE; --c1t:#B3172D;
  --c2:#6A4BC4; --c2s:#EFEAFB; --c2t:#4A2F94;
  --c3:#1F9D6B; --c3s:#E3F5ED; --c3t:#176F4F;
  --c4:#E8A317; --c4s:#FDF3DA; --c4t:#8A5A00;
  --c5:#1E78D6; --c5s:#E3F0FC; --c5t:#145AA6;
  --mc:var(--c2); --mcs:var(--c2s); --mct:var(--c2t); --mci:#FFFFFF;
  --accent:var(--mc); --accent-soft:var(--mcs); --accent-ink:var(--mct); --btn:var(--mc); --btn-ink:var(--mci);
  --gold:#E8A317; --gold-soft:#FDF3DA; --gold-ink:#8A5A00;
  --bad:#D7263D; --bad-soft:#FDECEE; --good:#1F9D6B; --good-soft:#E3F5ED;
  --code-bg:#1E2230; --code-ink:#E8EAF2; --code-kw:#FF79C6; --code-ty:#8BE9FD; --code-cm:#8D93AB;
  --shadow:0 1px 2px rgba(31,36,48,.10),0 4px 12px rgba(31,36,48,.06);
  color-scheme:light; --f-title:'Montserrat',system-ui,sans-serif; --f-body:'Open Sans',system-ui,sans-serif; --f-mono:'JetBrains Mono',Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#14161C; --surface:#1D2028; --soft:#262A34; --ink:#ECEEF4; --muted:#A5ABBA; --line:#363B49;
  --c1:#FF6B80; --c1s:#3B1D25; --c1t:#FF9AA9;
  --c2:#A58CF5; --c2s:#2A2447; --c2t:#C9B9FA;
  --c3:#4FCB9C; --c3s:#16352B; --c3t:#86E0BE;
  --c4:#F0B43E; --c4s:#3A2F17; --c4t:#F5CC7A;
  --c5:#5CA8F5; --c5s:#17304A; --c5t:#94C6FA; --mci:#14161C;
  --gold:#F0B43E; --gold-soft:#3A2F17; --gold-ink:#F5CC7A;
  --bad:#FF6B80; --bad-soft:#3B1D25; --good:#4FCB9C; --good-soft:#16352B;
  --code-bg:#0E1016; --shadow:0 1px 2px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.35); color-scheme:dark}
[data-m="1"]{--mc:var(--c1);--mcs:var(--c1s);--mct:var(--c1t)}
[data-m="2"]{--mc:var(--c2);--mcs:var(--c2s);--mct:var(--c2t)}
[data-m="3"]{--mc:var(--c3);--mcs:var(--c3s);--mct:var(--c3t)}
[data-m="4"]{--mc:var(--c4);--mcs:var(--c4s);--mct:var(--c4t);--mci:#2A1B00}
[data-m="5"]{--mc:var(--c5);--mcs:var(--c5s);--mct:var(--c5t)}
[data-m]{--accent:var(--mc);--accent-soft:var(--mcs);--accent-ink:var(--mct);--btn:var(--mc);--btn-ink:var(--mci)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-title);margin:0;text-wrap:balance}
p{margin:0}
code,.mono{font-family:var(--f-mono)}
button{font:inherit}

/* encabezado */
.top{margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:20px max(16px,env(safe-area-inset-left,0px)) 14px;background:var(--bg);border-bottom:1px solid var(--line);position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:5px;background:linear-gradient(90deg,var(--c1) 0 20%,var(--c2) 20% 40%,var(--c3) 40% 60%,var(--c4) 60% 80%,var(--c5) 80%)}
.top .in{max-width:1080px;margin:0 auto;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.top small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top h1{font-size:clamp(20px,3.4vw,28px);font-weight:800;margin-top:2px;color:var(--ink)}
.tools{display:flex;gap:10px;align-items:center}
.theme{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.theme svg{width:20px;height:20px}
.score{font-family:var(--f-title);font-weight:700;background:var(--soft);padding:8px 14px;border-radius:6px;font-size:14px;white-space:nowrap}
.score b{color:var(--c4t);font-size:18px}

/* navegación */
.nav{display:flex;gap:6px;overflow-x:auto;padding:16px 0 6px;margin-bottom:8px;scrollbar-width:thin}
.nav button{flex:0 0 auto;border:1px solid var(--line);border-bottom:3px solid var(--mc);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:6px;cursor:pointer;
  font-family:var(--f-title);font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center}
.nav button .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--mcs);color:var(--mct);font-size:12px}
.nav button.on{background:var(--mc);color:var(--mci);border-color:var(--mc)}
.nav button.on .n{background:rgba(255,255,255,.25);color:inherit}
.nav button.done .n{background:var(--mc);color:var(--mci)}
.nav button .st{color:var(--c4);font-size:12px;letter-spacing:1px}
.nav button.on .st{color:inherit}

/* misión */
.mhead{margin:14px 0 18px}
.tag{display:inline-block;background:var(--mc);color:var(--mci);font-family:var(--f-title);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:4px}
.mhead h2{font-size:clamp(22px,3.4vw,30px);font-weight:800;margin:8px 0 6px;color:var(--ink)}
.mhead .lead{max-width:70ch;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--mc);border-radius:8px;padding:16px;box-shadow:var(--shadow)}
.eyebrow{font-family:var(--f-title);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink)}

/* piezas y zonas */
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:8px 12px;margin:3px;border:1px solid var(--line);border-left:4px solid var(--accent);
  background:var(--surface);color:var(--ink);border-radius:6px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;font-size:14px;line-height:1.4;box-shadow:var(--shadow);vertical-align:middle}
.chip.code{font-family:var(--f-mono);font-size:13px;background:var(--code-bg);color:var(--code-ink);border-color:var(--code-bg);border-left-color:var(--gold)}
.chip.cls{font-family:var(--f-title);font-weight:700;font-size:13px;border-left-color:var(--gold)}
.chip:focus-visible,.zone:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chip.sel{outline:3px solid var(--gold);outline-offset:1px}
.chip.src{opacity:.3}
.chip[data-locked]{cursor:default;box-shadow:none}
.ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-60%) rotate(-2deg);box-shadow:0 12px 28px rgba(0,0,0,.35);opacity:.95}
.zone{min-height:44px}
.slot{display:flex;flex-wrap:wrap;align-items:center;border:2px dashed var(--line);border-radius:6px;padding:2px;background:var(--soft);position:relative}
.slot:not(:has(.chip))::before{content:attr(data-ph);color:var(--muted);font-size:13px;padding:0 10px;font-style:italic}
.slot.over,.bank.over,.bucket.over{border-color:var(--gold);background:var(--gold-soft)}
.slot.ok{border:2px solid var(--good);background:var(--good-soft)}
.slot.bad{border:2px solid var(--bad);background:var(--bad-soft)}
.bank{border:2px dashed var(--line);border-radius:8px;padding:8px;min-height:60px;background:var(--surface)}
.bank-t{font-family:var(--f-title);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.bucket{border:2px dashed var(--line);border-radius:8px;padding:8px;min-height:130px;background:var(--surface)}
.bucket h4{font-family:var(--f-title);font-size:14px;margin:0 0 6px;color:var(--mct)}
.bucket.ok{border:2px solid var(--good)} .bucket.bad{border:2px solid var(--bad)}
.chip.ok{border-left-color:var(--good)} .chip.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.chip.code.bad{background:var(--code-bg);outline:2px solid var(--bad)}

/* botones */
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 10px}
.btn{border:0;background:var(--btn);color:var(--btn-ink);padding:10px 18px;border-radius:6px;font-weight:700;cursor:pointer;font-family:var(--f-title);font-size:14px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--mc);color:var(--mci)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.fb{border-radius:8px;padding:12px 14px;margin-top:8px;border-left:5px solid var(--mc);background:var(--mcs)}
.fb.ok{border-color:var(--good);background:var(--good-soft)} .fb.bad{border-color:var(--bad);background:var(--bad-soft)} .fb.hint{border-color:var(--gold);background:var(--gold-soft)}
.fb b{font-family:var(--f-title)}
.fb ul{margin:6px 0 0;padding-left:20px}

/* misión 1 */
.m1{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cbox{border:2px solid var(--accent);border-radius:6px;background:var(--surface);overflow:hidden}
.cbox .hd{background:var(--mcs);padding:8px 12px;text-align:center;font-family:var(--f-title);font-weight:700;color:var(--accent-ink)}
.cbox .bd{padding:12px;font-family:var(--f-mono);font-size:13px;display:grid;gap:8px}
.big{font-family:var(--f-title);font-weight:800;font-size:24px;color:var(--mct)}
.log{font-family:var(--f-mono);font-size:13px;background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:12px 14px;margin-top:14px;min-height:60px}
.log div{opacity:0;animation:in .35s forwards;padding:2px 0}
.log .ret{color:var(--code-cm)} .log .self{color:var(--code-ty)} .log .tot{color:#7CE3B5;font-weight:600}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.impact{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{font-family:var(--f-mono);font-size:12px;padding:4px 10px;border-radius:4px;border:1px solid var(--line);background:var(--surface)}
.pill.new{background:var(--good-soft);border-color:var(--good);color:var(--good)} .pill.mod{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}

/* misión 2 */
.uml{display:grid;gap:10px;margin-top:6px}
.row1{display:grid;grid-template-columns:1fr minmax(120px,170px) 1fr;align-items:center;gap:6px}
.link{display:grid;gap:4px;justify-items:center;text-align:center;font-size:12px;color:var(--muted)}
.link .ln{width:100%;height:0;border-top:2px solid var(--accent)} .link .ln.dash{border-top-style:dashed}
.vlink{display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--muted)} .vlink .ln{width:0;height:18px;border-left:2px dashed var(--accent)}
.row3{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ubox{border:2px solid var(--accent);border-radius:4px;background:var(--surface);display:grid}
.ubox .role{font-size:11px;font-family:var(--f-title);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink);padding:6px 8px 0;text-align:center}
.ubox .uh{padding:6px;border-bottom:1px solid var(--line)}
.ubox .ua{padding:6px;border-bottom:1px solid var(--line);display:grid;gap:4px;font-size:12px}
.ubox .um{padding:6px 8px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.ubox .ua .slot{min-height:36px}
.uml[data-phase="1"] .p2,.uml[data-phase="1"] .p3,.uml[data-phase="2"] .p3{display:none}
.ubox .uh .slot{min-height:46px}

/* misión 3 */
.seqrow{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;margin:6px 0}
.seqrow .no{font-family:var(--f-title);font-weight:800;color:var(--accent-ink);text-align:center}
.svgbox{margin-top:14px;overflow-x:auto}
.svgbox svg{min-width:640px;width:100%;height:auto}
.svgbox text{fill:var(--ink);font-family:var(--f-mono);font-size:13px}
.svgbox .nm{fill:#fff;font-weight:600}
.svgbox .ret text{fill:var(--muted)}

/* misión 4 */
pre.src{background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:14px 16px;font-family:var(--f-mono);font-size:13px;line-height:2.1;overflow-x:auto;margin:0}
pre.src .kw{color:var(--code-kw)} pre.src .ty{color:var(--code-ty)} pre.src .cm{color:var(--code-cm)}
pre.src .slot{display:inline-flex;min-height:34px;vertical-align:middle;min-width:130px;background:rgba(255,255,255,.06);border-color:#6B63A8}
pre.src .slot:not(:has(.chip))::before{color:#B7B0DD}
pre.src .slot.ok{background:rgba(79,199,160,.15)} pre.src .slot.bad{background:rgba(255,112,136,.15)}
.pfile{font-family:var(--f-title);font-weight:700;font-size:13px;color:var(--accent-ink);margin:16px 0 6px}
.buckets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.buckets4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

table.tar{border-collapse:collapse;width:100%;font-size:13.5px}
table.tar th,table.tar td{border:1px solid var(--line);padding:7px 10px;text-align:left}
table.tar th{background:var(--mcs);color:var(--mct);font-family:var(--f-title)}
table.tar td.yes{background:var(--good-soft);color:var(--good);font-weight:600}
table.tar td.no{background:var(--bad-soft);color:var(--bad);font-weight:600}
/* protección y registro */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
#mark{position:fixed;inset:0;z-index:900;pointer-events:none;display:none;background-repeat:repeat}
.away{position:fixed;inset:0;z-index:1000;background:var(--bg);display:none;place-items:center;text-align:center;padding:24px}
.away.on{display:grid}
.away h2{font-size:24px;margin-bottom:8px}
.clock{margin-left:10px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:10px}
.fields label{font-family:var(--f-title);font-weight:700;font-size:13px;display:block;margin-bottom:4px}
.fields input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:100%}
.fields input[disabled]{background:var(--soft);color:var(--muted)}
.sumtab{width:100%;border-collapse:collapse;font-size:14px}
.sumtab th,.sumtab td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.sumtab th{font-family:var(--f-title);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
@media print{body{display:none!important}}
/* inicio y resumen */
.hero{display:grid;gap:14px;max-width:760px}
.team{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.team input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:220px;flex:1}
.mlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.mlist .card h3{font-size:15px;color:var(--mct)} .mlist .card p{color:var(--muted);font-size:13px;margin-top:4px}
.sumrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.stars{color:var(--gold);letter-spacing:2px}
textarea.out{width:100%;min-height:150px;font-family:var(--f-mono);font-size:12.5px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.mini{font-size:13px;color:var(--muted)}
@media (max-width:720px){
  .m1{grid-template-columns:1fr} .row1{grid-template-columns:1fr} .row3{grid-template-columns:1fr 1fr}
  .buckets,.buckets4{grid-template-columns:1fr} .link .ln{width:0;height:14px;border-top:0;border-left:2px solid var(--accent)} .link .ln.dash{border-left-style:dashed}
}
@media (prefers-reduced-motion:reduce){.log div{animation:none;opacity:1}}
</style>

<div class="top"><div class="in">
  <div><small>Ingeniería de Software 2 · Patrones de diseño</small><h1>Laboratorio Strategy: los envíos de PaqueteYa</h1></div>
  <div class="tools"><div class="score" aria-live="polite">Estrellas <b id="tot">0</b> / 15</div><button class="theme" id="theme" type="button"></button></div>
</div></div>
<div class="wrap">
  <nav class="nav" id="nav" aria-label="Misiones"></nav>
  <main id="view"></main>
</div>

<div id="mark" aria-hidden="true"></div>
<div class="away" id="away"><div><h2>Contenido oculto</h2><p>Vuelve a esta ventana para continuar. Cada salida de la página queda registrada en el informe.</p></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const fmt=n=>'$'+String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const BLANK=()=>({name:'',group:'',sid:'',att:1,started:0,seed:1,m:{},t:{},lv:{},log:{},fin:{},out:0,outS:0,blk:0,res:null});
let st=BLANK();
try{const r=JSON.parse(localStorage.getItem('lab-strategy-paqueteya')||'null');if(r&&typeof r==='object')st=Object.assign(st,r);}catch(e){}
if(st.started&&!st.sid)st=BLANK();   /* avance de una versión anterior: se reinicia */
const save=()=>{try{localStorage.setItem('lab-strategy-paqueteya',JSON.stringify(st));}catch(e){}};
const starsOf=n=>'★'.repeat(n)+'☆'.repeat(3-n);
const mmss=n=>{n=Math.max(0,Math.round(n||0));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');};
const plain=h=>String(h).replace(/<[^>]*>/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\s+/g,' ').trim();
function logEv(id,txt){if(!id||id<1||id>5)return;const a=(st.log[id]=st.log[id]||[]);a.push([st.t[id]||0,txt]);if(a.length>70)a.shift();}
function snap(id,lines){st.fin[id]=lines;save();}
function hashStr(x){let h=2166136261;for(const c of x){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}

/* ============ conexión con el servidor ============ */
const API_URL='https://script.google.com/macros/s/AKfycby6kFwyvvlTjOeqUCHshRPh0YgXkyDKWGJhknCQl_bnNBVbU4NLRVeIer8EhT9jCQ6C/exec';
let busy=false,rseq=0;
async function api(op,data){
  if(!API_URL)throw {code:'config'};
  const rid=(st.sid||'x')+'-'+(++rseq)+'-'+Date.now().toString(36);
  const body=JSON.stringify(Object.assign({op,sid:st.sid,rid,t:st.t},data||{}));
  let last={code:'net'};
  for(let i=0;i<3;i++){
    try{const r=await fetch(API_URL,{method:'POST',body,headers:{'Content-Type':'text/plain;charset=utf-8'}});const j=await r.json();if(j&&j.s===1)return j;last={code:(j&&j.e)||'srv'};if(last.code==='sesion'||last.code==='datos')break;}
    catch(e){last={code:'net'};}
    await new Promise(r=>setTimeout(r,700*(i+1)));
  }
  throw last;
}
function netErr(e){

async function guard(btn,fn){

let sel=null,cur=null;
function mkChip(id,label,kind){const c=el('div','chip'+(kind?' '+kind:''),label);c.dataset.id=id;c.tabIndex=0;c.setAttribute('role','button');return c;}
function mkBank(chips,title){const b=el('div','zone bank');b.dataset.multi='1';b.tabIndex=0;chips.forEach(c=>{b.appendChild(c);c._home=b;});return b;}
function mkSlot(ph,ans){const s=el('div','zone slot');s.dataset.ph=ph;s.tabIndex=0;if(ans)s.dataset.ans=ans;return s;}
function mkBucket(title,ans){const b=el('div','zone bucket');b.dataset.multi='1';b.dataset.ans=ans;b.tabIndex=0;b.innerHTML='<h4>'+title+'</h4>';return b;}
function place(chip,zone){
  if(!zone||chip.dataset.locked||zone.dataset.locked)return;
  const from=chip.parentElement;
  if(!zone.dataset.multi){
    const occ=[...zone.children].find(c=>c.classList.contains('chip'));
    if(occ&&occ!==chip){ if(occ.dataset.locked)return; const back=from&&from.classList.contains('zone')?from:occ._home; if(back&&back!==zone)back.appendChild(occ); }
  }
  zone.appendChild(chip);
  chip.classList.remove('sel');sel=null;
  $$('.ok,.bad',cur&&cur.root||document).forEach(n=>{if(!n.dataset.keep)n.classList.remove('ok','bad');});
  if(cur&&cur.onChange)cur.onChange(zone,chip);
}
let press=null,drag=null,over=null;
document.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.chip');if(!c||c.dataset.locked)return;
  if(e.button!==undefined&&e.button>0)return;
  press={c,x:e.clientX,y:e.clientY};
});
document.addEventListener('pointermove',e=>{
  if(!press)return;
  if(!drag){
    if(Math.hypot(e.clientX-press.x,e.clientY-press.y)<6)return;
    const g=press.c.cloneNode(true);g.classList.add('ghost');g.classList.remove('sel');document.body.appendChild(g);
    press.c.classList.add('src');drag={c:press.c,g};
  }
  e.preventDefault();
  drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';
  const z=document.elementFromPoint(e.clientX,e.clientY);const zone=z&&z.closest('.zone');
  if(over&&over!==zone)over.classList.remove('over');
  over=zone;if(over)over.classList.add('over');
},{passive:false});
function endPress(e,cancel){
  if(!press)return;
  const p=press;press=null;
  if(drag){
    const d=drag;drag=null;d.g.remove();d.c.classList.remove('src');
    if(over){over.classList.remove('over');if(!cancel)place(d.c,over);over=null;}
    return;
  }
  if(cancel)return;
  clickChip(p.c);
}
document.addEventListener('pointerup',e=>endPress(e,false));
document.addEventListener('pointercancel',e=>endPress(e,true));
function clickChip(c){
  if(sel&&sel!==c){const z=c.parentElement;if(z&&z.classList.contains('zone')&&!z.classList.contains('bank')){place(sel,z);return;}}
  if(sel===c){c.classList.remove('sel');sel=null;return;}
  if(sel)sel.classList.remove('sel');
  sel=c;c.classList.add('sel');
}
document.addEventListener('click',e=>{
  if(e.target.closest('.chip'))return;
  const z=e.target.closest('.zone');
  if(z&&sel)place(sel,z);
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const c=e.target.closest&&e.target.closest('.chip');
  if(c){e.preventDefault();clickChip(c);return;}
  const z=e.target.closest&&e.target.closest('.zone');
  if(z&&sel&&e.target===z){e.preventDefault();place(sel,z);}
});

  MNAMES.forEach((n,i)=>{const m=st.m[i+1];need(22);doc.setFillColor(...(i%2?[255,255,255]:[246,247,249]));doc.rect(M,y-10,CW,20,'F');doc.setFillColor(...PC[i]);doc.rect(M,y-10,4,20,'F');doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(...INK);
    [`${i+1}. ${n}`,m?m.stars+' / 3':'sin completar',m?String(m.err):'-',m?String(m.hints):'-',mmss(st.t[i+1]),String(st.lv[i+1]||0)].forEach((v,k)=>doc.text(L1(v),M+cols[k][1]+8,y+3));y+=20;});
  y+=14;

    txt(`Estado: ${m?'completada':'sin completar'}   |   Tiempo: ${mmss(st.t[id])}   |   Errores: ${m?m.err:'-'}   |   Pistas: ${m?m.hints:'-'}   |   Estrellas: ${m?m.stars+'/3':'-'}   |   Salidas: ${st.lv[id]||0}`,M,9,true,MUT);
    const fin=st.fin[id];if(fin&&fin.length){y+=2;txt('Respuestas finales',M,10,true);fin.forEach(l=>txt('- '+l,M+8,9,false,INK,CW-8));}

    y+=12;});
  doc.__id=code;

function stamp(doc){
  const W=595,H=842,M=40,N=doc.getNumberOfPages(),MUT=[91,98,112];
  for(let i=1;i<=N;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...MUT);doc.text(`Código de entrega ${doc.__id}  |  ${L1(st.name||'')}  |  Página ${i} de ${N}`,M,H-24);}
}
async function rasterize(textDoc){
  const lib=window.pdfjsLib;if(!lib)throw new Error('pdfjs');
  if(!lib.GlobalWorkerOptions.workerSrc){const r=await fetch(PDFJS_WORKER);if(!r.ok)throw new Error('worker');lib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(await r.blob());}
  const pdf=await lib.getDocument({data:new Uint8Array(textDoc.output('arraybuffer'))}).promise;const imgs=[];
  for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p),vp=pg.getViewport({scale:2});const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:x,viewport:vp}).promise;imgs.push(c.toDataURL('image/jpeg',0.86));}
  return imgs;
}
async function buildFinalPdf(){
  const base=buildPdf(false);let imgs=null,mode='imagen';
  try{imgs=await rasterize(base);}catch(e){imgs=null;}
  const {jsPDF}=window.jspdf;let out;
  if(imgs){out=new jsPDF(pdfOpts(true));imgs.forEach((d,i)=>{if(i)out.addPage();out.addImage(d,'JPEG',0,0,595,842,undefined,'FAST');});out.__id=base.__id;}
  else{out=buildPdf(true);mode='texto';}
  stamp(out);out.__mode=mode;return out;
}
async function pdfExport(){
  const msg=$('#pdfm');
  if(!(window.jspdf&&window.jspdf.jsPDF)){msg.textContent='No se pudo cargar el generador de PDF. Revisa la conexión y vuelve a abrir el laboratorio.';return;}
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){}
  try{msg.textContent='Registrando tu entrega...';const r=await api('final',{out:st.out,outS:st.outS,blk:st.blk});st.res=r;save();const vc=$('#vcode');if(vc)vc.value=r.code;}catch(e){msg.textContent=e&&e.code==='config'?'Falta conectar el servidor.':'No se pudo registrar tu entrega en el servidor. Revisa tu internet y vuelve a intentarlo.';return;}
  let doc;try{msg.textContent='Preparando el informe...';doc=await buildFinalPdf();}catch(e){msg.textContent='No se pudo armar el informe: '+(e&&e.message||'error');return;}
  const slug=(st.name||'estudiante').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'estudiante';
  if(!dl){if(!window.claude){doc.save(`Laboratorio-Strategy-${slug}.pdf`);msg.textContent='Informe descargado.';}else msg.textContent='Este visor no permite descargar archivos. Abre el laboratorio desde claude.ai para exportar el PDF.';return;}
  try{await dl.save({filename:`Laboratorio-Strategy-${slug}.pdf`,data:doc.output('arraybuffer')});msg.textContent='Informe guardado.';}
  catch(e){msg.textContent=e&&e.code==='declined'?'Descarga cancelada. Puedes intentarlo de nuevo.':'No se pudo guardar el PDF ('+((e&&e.code)||'error')+').';}
}

/* ============ navegación ============ */
const VIEWS=[intro,m1,m2,m3,m4,m5,summary];

function go(i){
  now=Math.max(0,Math.min(6,i));sel=null;cur=null;fbEl=null;running=(now>=1&&now<=5)&&!st.m[now]&&!!st.started;
  view.innerHTML='';const root=el('section');root.dataset.m=(now>=1&&now<=5)?now:(now===6?4:2);view.appendChild(root);

function updClock(){const c=$('#clock');if(c)c.textContent='Tiempo de esta misión: '+mmss(st.t[now]||0);}

/* Marca de agua con el nombre del estudiante: cualquier captura o foto queda identificada. */
function applyMark(){
  const m=$('#mark');if(!m)return;
  if(!st.started||!st.name){m.style.display='none';return;}
  const x=s=>String(s).replace(/[&<>"]/g,'');
  const tag=x(st.name).slice(0,40)+' · '+x(st.group).slice(0,24)+' · '+(st.sid||'').slice(0,6).toUpperCase();
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="360" height="190"><text x="180" y="95" transform="rotate(-24 180 95)" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="rgb(128,128,128)" fill-opacity="0.2">${tag}</text></svg>`;
  m.style.backgroundImage='url("data:image/svg+xml;utf8,'+encodeURIComponent(svg)+'")';m.style.display='block';
}
let awayRun=false,awayM=0;
function setAway(v){
  /* La pantalla se oculta al perder el foco en cualquier vista (misiones, resumen y después de entregar). Solo se cuentan salidas mientras una misión está en curso. */
  if(v&&!away){if(!st.started)return;away=true;awayAt=Date.now();awayRun=running&&now>=1&&now<=5;awayM=now;$('#away').classList.add('on');}
  else if(!v&&away){away=false;$('#away').classList.remove('on');const d=(Date.now()-awayAt)/1000;
    if(awayRun&&d>=2){st.out++;st.outS+=Math.round(d);st.lv[awayM]=(st.lv[awayM]||0)+1;logEv(awayM,'Salió de la página '+Math.round(d)+' s');save();}}
}

const isField=t=>{const n=t&&(t.nodeType===3?t.parentElement:t);return !!(n&&n.closest&&n.closest('input,textarea'));};
['copy','cut','contextmenu','dragstart'].forEach(ev=>document.addEventListener(ev,e=>{if(isField(e.target))return;e.preventDefault();st.blk++;}));

  if(hit){e.preventDefault();st.blk++;if(e.key==='PrintScreen'){try{navigator.clipboard.writeText('Captura no permitida');}catch(_){}}}
},true);
