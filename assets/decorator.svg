<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="de-t de-d">
  <title id="de-t">Ilustración del patrón Decorator</title>
  <desc id="de-d">Un objeto rojo en el centro, envuelto por dos anillos, uno dorado y otro gris. Cada anillo agrega una función sin cambiar el objeto de adentro.</desc>
  <style>
    .de-lb{font:600 10px 'Open Sans',Arial,sans-serif;fill:#55555F}
    .de-tx{font:600 10px 'Montserrat',Arial,sans-serif;fill:#FFFFFF}
    .de-tk{font:600 11px 'Montserrat',Arial,sans-serif;fill:#2A2A30}
    .de-m,.de-v{transform-box:fill-box;transform-origin:center}
    .go .de-m{animation:de-in .5s var(--d,0s) cubic-bezier(.2,.7,.2,1) both}
    .go .de-v{animation:de-mv .6s var(--d,0s) cubic-bezier(.4,0,.2,1) both}
    .go .de-l{stroke-dasharray:1;animation:de-dr .5s var(--d,0s) cubic-bezier(.2,.7,.2,1) both}
    @keyframes de-in{from{opacity:0;transform:translate(var(--x,0px),var(--y,0px)) scale(var(--s,1))}to{opacity:1;transform:none}}
    @keyframes de-mv{from{transform:none}to{transform:translate(var(--x,0px),var(--y,0px))}}
    @keyframes de-dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){.go .de-m,.go .de-v,.go .de-l{animation:none}}
  </style>
  <g class="de-m" style="--x:0px;--y:0px;--s:0.7;--d:0.4s"><circle cx="150" cy="94" r="56" fill="none" stroke="#D9D5D0" stroke-width="12"/></g><g class="de-m" style="--x:0px;--y:0px;--s:0.7;--d:0.2s"><circle cx="150" cy="94" r="38" fill="none" stroke="#DF9C30" stroke-width="12"/></g><circle cx="150" cy="94" r="22" fill="#C52646"/><rect x="141" y="86" width="18" height="16" rx="3" fill="#FFFFFF" opacity=".9"/><path class="de-l" pathLength="1" style="--d:0.55s" d="M174 94H232" fill="none" stroke="#8C8A90" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text class="de-lb" x="238" y="98" text-anchor="start">objeto</text><path class="de-l" pathLength="1" style="--d:0.6s" d="M186 70H232" fill="none" stroke="#8C8A90" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text class="de-lb" x="238" y="74" text-anchor="start">+ función</text><path class="de-l" pathLength="1" style="--d:0.65s" d="M204 50H232" fill="none" stroke="#8C8A90" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text class="de-lb" x="238" y="54" text-anchor="start">+ función</text>
  <text class="de-lb" x="160" y="192" text-anchor="middle">agrega funciones envolviendo al objeto</text>
</svg>
