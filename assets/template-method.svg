<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="tm-t tm-d">
  <title id="tm-t">Ilustración del patrón Template Method</title>
  <desc id="tm-d">Una plantilla con cuatro pasos numerados. Los pasos uno y cuatro ya vienen fijos en gris; los pasos dos y tres están en blanco y cada clase hija los completa.</desc>
  <style>
    .tm-lb{font:600 10px 'Open Sans',Arial,sans-serif;fill:#55555F}
    .tm-tx{font:600 10px 'Montserrat',Arial,sans-serif;fill:#FFFFFF}
    .tm-tk{font:600 11px 'Montserrat',Arial,sans-serif;fill:#2A2A30}
    .tm-m,.tm-v{transform-box:fill-box;transform-origin:center}
    .go .tm-m{animation:tm-in .5s var(--d,0s) cubic-bezier(.2,.7,.2,1) both}
    .go .tm-v{animation:tm-mv .6s var(--d,0s) cubic-bezier(.4,0,.2,1) both}
    .go .tm-l{stroke-dasharray:1;animation:tm-dr .5s var(--d,0s) cubic-bezier(.2,.7,.2,1) both}
    @keyframes tm-in{from{opacity:0;transform:translate(var(--x,0px),var(--y,0px)) scale(var(--s,1))}to{opacity:1;transform:none}}
    @keyframes tm-mv{from{transform:none}to{transform:translate(var(--x,0px),var(--y,0px))}}
    @keyframes tm-dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){.go .tm-m,.go .tm-v,.go .tm-l{animation:none}}
  </style>
  <rect x="60" y="18" width="200" height="154" rx="8" fill="#FFFFFF" stroke="#2A2A30" stroke-width="2"/><path d="M60 26a8 8 0 0 1 8-8h184a8 8 0 0 1 8 8v14H60z" fill="#C52646"/><text class="tm-tx" x="160" y="33" text-anchor="middle">plantilla</text><circle cx="84" cy="60" r="10" fill="#2A2A30"/><text class="tm-tx" x="84" y="63.5" text-anchor="middle">1</text><circle cx="84" cy="88" r="10" fill="#2A2A30"/><text class="tm-tx" x="84" y="91.5" text-anchor="middle">2</text><circle cx="84" cy="116" r="10" fill="#2A2A30"/><text class="tm-tx" x="84" y="119.5" text-anchor="middle">3</text><circle cx="84" cy="144" r="10" fill="#2A2A30"/><text class="tm-tx" x="84" y="147.5" text-anchor="middle">4</text><rect x="104" y="57" width="130" height="7" rx="3.5" fill="#D9D5D0"/><rect x="104" y="141" width="110" height="7" rx="3.5" fill="#D9D5D0"/><rect x="102" y="78" width="136" height="20" rx="4" fill="none" stroke="#8C8A90" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="102" y="106" width="136" height="20" rx="4" fill="none" stroke="#8C8A90" stroke-width="1.5" stroke-dasharray="4 3"/><g class="tm-m" style="--x:24px;--y:0px;--s:1;--d:0.15s"><rect x="106" y="82" width="104" height="12" rx="3" fill="#DF9C30"/></g><g class="tm-m" style="--x:24px;--y:0px;--s:1;--d:0.35s"><rect x="106" y="110" width="84" height="12" rx="3" fill="#C52646"/></g>
  <text class="tm-lb" x="160" y="192" text-anchor="middle">pasos fijos y pasos que completa cada hija</text>
</svg>
