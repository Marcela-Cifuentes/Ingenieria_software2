<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="fs-t fs-d">
  <title id="fs-t">Ilustración de Factory Method y Singleton</title>
  <desc id="fs-d">A la izquierda, una pequeña fábrica roja con una banda transportadora que entrega objetos distintos: un círculo, un cuadrado y un triángulo. A la derecha, cuatro llaves grises en sombra y una sola llave dorada destacada, que representa la única instancia del Singleton.</desc>
  <style>
    .fs-red{fill:#C52646}.fs-dark{fill:#9E1C37}.fs-gold{fill:#DF9C30}
    .fs-gray{fill:#8C8A90}.fs-shadow{fill:#D9D5D0}
    .fs-belt{fill:none;stroke:#2A2A30;stroke-width:2;stroke-linecap:round}
    .fs-lb{font:600 10px 'Open Sans',Arial,sans-serif;fill:#55555F}
    .fs-obj,.fs-key{transform-box:fill-box;transform-origin:center}
    .go .fs-o1{animation:fs-move .6s cubic-bezier(.4,0,.2,1) both}
    .go .fs-o2{animation:fs-move .6s .2s cubic-bezier(.4,0,.2,1) both}
    .go .fs-o3{animation:fs-move .6s .4s cubic-bezier(.4,0,.2,1) both}
    .go .fs-key{animation:fs-rise .5s .9s cubic-bezier(.4,0,.2,1) both}
    @keyframes fs-move{0%{transform:translateX(-34px);opacity:0}35%{opacity:1}100%{transform:translateX(0);opacity:1}}
    @keyframes fs-rise{0%{transform:translateY(0)}100%{transform:translateY(-6px)}}
    @media (prefers-reduced-motion:reduce){.go .fs-o1,.go .fs-o2,.go .fs-o3,.go .fs-key{animation:none}}
  </style>
  <!-- Fábrica (Factory Method) -->
  <rect class="fs-red" x="18" y="62" width="74" height="64" rx="4"/>
  <path class="fs-dark" d="M18 66l22-18v18l22-18v18l22-18v18h8v4H18z"/>
  <rect class="fs-dark" x="72" y="30" width="12" height="36" rx="2"/>
  <rect x="32" y="90" width="18" height="18" rx="2" fill="#FFFFFF" opacity=".9"/>
  <rect x="58" y="100" width="26" height="26" rx="2" fill="#FFFFFF" opacity=".9"/>
  <!-- Banda transportadora con productos distintos -->
  <path class="fs-belt" d="M92 126h88"/>
  <circle cx="100" cy="132" r="4" fill="#2A2A30"/><circle cx="172" cy="132" r="4" fill="#2A2A30"/>
  <circle class="fs-obj fs-o1" cx="110" cy="114" r="10" fill="#C52646"/>
  <rect class="fs-obj fs-o2" x="128" y="104" width="20" height="20" rx="2" fill="#DF9C30"/>
  <path class="fs-obj fs-o3" d="M156 124l11-20 11 20z" fill="#8C8A90"/>
  <text class="fs-lb" x="98" y="158" text-anchor="middle">Factory Method</text>
  <!-- Llaves: muchas sombras, una sola real (Singleton) -->
  <g class="fs-shadow">
    <g transform="translate(206 44)"><circle cx="9" cy="9" r="9"/><rect x="16" y="6" width="24" height="6" rx="2"/><rect x="32" y="12" width="5" height="7"/></g>
    <g transform="translate(262 44)"><circle cx="9" cy="9" r="9"/><rect x="16" y="6" width="24" height="6" rx="2"/><rect x="32" y="12" width="5" height="7"/></g>
    <g transform="translate(206 120)"><circle cx="9" cy="9" r="9"/><rect x="16" y="6" width="24" height="6" rx="2"/><rect x="32" y="12" width="5" height="7"/></g>
    <g transform="translate(262 120)"><circle cx="9" cy="9" r="9"/><rect x="16" y="6" width="24" height="6" rx="2"/><rect x="32" y="12" width="5" height="7"/></g>
  </g>
  <g class="fs-key">
    <g transform="translate(226 80)">
      <circle class="fs-gold" cx="13" cy="13" r="13"/><circle cx="13" cy="13" r="5" fill="#FFFFFF"/>
      <rect class="fs-gold" x="24" y="9" width="36" height="8" rx="2"/>
      <rect class="fs-gold" x="48" y="17" width="6" height="10"/><rect class="fs-gold" x="38" y="17" width="5" height="7"/>
    </g>
  </g>
  <text class="fs-lb" x="256" y="170" text-anchor="middle">Singleton: una sola</text>
</svg>
