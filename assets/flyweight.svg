<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="fl-t fl-d">
  <title id="fl-t">Ilustración del patrón Flyweight</title>
  <desc id="fl-d">Un único modelo dorado de árbol a la izquierda y, a la derecha, un bosque de muchos árboles pequeños que comparten ese mismo modelo en lugar de guardar cada uno una copia.</desc>
  <style>
    .fl-lb{font:600 10px 'Open Sans',Arial,sans-serif;fill:#55555F}
    .fl-tx{font:600 10px 'Montserrat',Arial,sans-serif;fill:#FFFFFF}
    .fl-tk{font:600 11px 'Montserrat',Arial,sans-serif;fill:#2A2A30}
    .fl-m,.fl-v{transform-box:fill-box;transform-origin:center}
    .go .fl-m{animation:fl-in .5s var(--d,0s) cubic-bezier(.2,.7,.2,1) both}
    .go .fl-v{animation:fl-mv .6s var(--d,0s) cubic-bezier(.4,0,.2,1) both}
    .go .fl-l{stroke-dasharray:1;animation:fl-dr .5s var(--d,0s) cubic-bezier(.2,.7,.2,1) both}
    @keyframes fl-in{from{opacity:0;transform:translate(var(--x,0px),var(--y,0px)) scale(var(--s,1))}to{opacity:1;transform:none}}
    @keyframes fl-mv{from{transform:none}to{transform:translate(var(--x,0px),var(--y,0px))}}
    @keyframes fl-dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){.go .fl-m,.go .fl-v,.go .fl-l{animation:none}}
  </style>
  <rect x="20" y="52" width="80" height="80" rx="8" fill="#F4F1EE" stroke="#2A2A30" stroke-width="2"/><path d="M60 65.6l19.8 30.800000000000004h-39.6z" fill="#DF9C30"/><rect x="56.7" y="96.4" width="6.6" height="11.0" fill="#8C8A90"/><text class="fl-lb" x="60" y="152" text-anchor="middle">modelo compartido</text><path class="fl-l" pathLength="1" style="--d:0.1s" d="M100 92H128" fill="none" stroke="#8C8A90" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g class="fl-m" style="--x:0px;--y:0px;--s:0.4;--d:0.1s"><path d="M150 38l9 14h-18z" fill="#C52646"/><rect x="148.5" y="52.0" width="3.0" height="5.0" fill="#8C8A90"/></g><g class="fl-m" style="--x:0px;--y:0px;--s:0.4;--d:0.135s"><path d="M188 38l9 14h-18z" fill="#C52646"/><rect x="186.5" y="52.0" width="3.0" height="5.0" fill="#8C8A90"/></g><g class="fl-m" style="--x:0px;--y:0px;--s:0.4;--d:0.17s"><path d="M226 38l9 14h-18z" fill="#C52646"/><rect x="224.5" y="52.0" width="3.0" height="5.0" fill="#8C8A90"/></g><g class="fl-m" style="--x:0px;--y:0px;--s:0.4;--d:0.20500000000000002s"><path d="M264 38l9 14h-18z" fill="#C52646"/><rect x="262.5" y="52.0" width="3.0" height="5.0" fill="#8C8A90"/></g><g class="fl-m" style="--x:0px;--y:0px;--s:0.4;--d:0.24000000000000002s"><path d="M150 78l9 14h-18z" fill="#C52646"/><rect x="148.5" y="92.0" width="3.0" height="5.0" fill="#8C8A90"/></g><g class="fl-m" style="--x:0px;--y:0px;--s:0.4;--d:0.275s"><path d="M188 78l9 14h-18z" fill="#C52646"/><rect x="186.5" y="92.0" width="3.0" height="5.0" fill="#8C8A90"/></g><g class="fl-m" style="--x:0px;--y:0px;--s:0.4;--d:0.31000000000000005s"><path d="M226 78l9 14h-18z" fill="#C52646"/><rect x="224.5" y="92.0" width="3.0" height="5.0" fill="#8C8A90"/></g><g class="fl-m" style="--x:0px;--y:0px;--s:0.4;--d:0.34500000000000003s"><path d="M264 78l9 14h-18z" fill="#C52646"/><rect x="262.5" y="92.0" width="3.0" height="5.0" fill="#8C8A90"/></g><g class="fl-m" style="--x:0px;--y:0px;--s:0.4;--d:0.38s"><path d="M150 118l9 14h-18z" fill="#C52646"/><rect x="148.5" y="132.0" width="3.0" height="5.0" fill="#8C8A90"/></g><g class="fl-m" style="--x:0px;--y:0px;--s:0.4;--d:0.41500000000000004s"><path d="M188 118l9 14h-18z" fill="#C52646"/><rect x="186.5" y="132.0" width="3.0" height="5.0" fill="#8C8A90"/></g><g class="fl-m" style="--x:0px;--y:0px;--s:0.4;--d:0.45000000000000007s"><path d="M226 118l9 14h-18z" fill="#C52646"/><rect x="224.5" y="132.0" width="3.0" height="5.0" fill="#8C8A90"/></g><g class="fl-m" style="--x:0px;--y:0px;--s:0.4;--d:0.485s"><path d="M264 118l9 14h-18z" fill="#C52646"/><rect x="262.5" y="132.0" width="3.0" height="5.0" fill="#8C8A90"/></g>
  <text class="fl-lb" x="160" y="192" text-anchor="middle">muchos objetos comparten un mismo modelo</text>
</svg>
