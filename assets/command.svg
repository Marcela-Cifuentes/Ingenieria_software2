<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="cm-t cm-d">
  <title id="cm-t">Ilustración del patrón Command</title>
  <desc id="cm-d">Un botón rojo a la izquierda y un receptor dorado a la derecha. Entre ambos viaja una tarjeta con la orden, como un objeto que se puede guardar, encolar o deshacer.</desc>
  <style>
    .cm-lb{font:600 10px 'Open Sans',Arial,sans-serif;fill:#55555F}
    .cm-tx{font:600 10px 'Montserrat',Arial,sans-serif;fill:#FFFFFF}
    .cm-tk{font:600 11px 'Montserrat',Arial,sans-serif;fill:#2A2A30}
    .cm-m,.cm-v{transform-box:fill-box;transform-origin:center}
    .go .cm-m{animation:cm-in .5s var(--d,0s) cubic-bezier(.2,.7,.2,1) both}
    .go .cm-v{animation:cm-mv .6s var(--d,0s) cubic-bezier(.4,0,.2,1) both}
    .go .cm-l{stroke-dasharray:1;animation:cm-dr .5s var(--d,0s) cubic-bezier(.2,.7,.2,1) both}
    @keyframes cm-in{from{opacity:0;transform:translate(var(--x,0px),var(--y,0px)) scale(var(--s,1))}to{opacity:1;transform:none}}
    @keyframes cm-mv{from{transform:none}to{transform:translate(var(--x,0px),var(--y,0px))}}
    @keyframes cm-dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){.go .cm-m,.go .cm-v,.go .cm-l{animation:none}}
  </style>
  <rect x="18" y="82" width="74" height="36" rx="18" fill="#C52646"/><text class="cm-tx" x="55" y="104" text-anchor="middle">botón</text><path class="cm-l" pathLength="1" style="--d:0.05s" d="M100 132H228" fill="none" stroke="#D9D5D0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="236" y="68" width="68" height="64" rx="6" fill="#FFFFFF" stroke="#2A2A30" stroke-width="2"/><path d="M236 74a6 6 0 0 1 6-6h56a6 6 0 0 1 6 6v12H236z" fill="#DF9C30"/><text class="cm-tx" x="270.0" y="81" text-anchor="middle" fill="#FFFFFF">receptor</text><rect x="246" y="94" width="41" height="6" rx="3" fill="#E4C1C8"/><rect x="246" y="106" width="29" height="6" rx="3" fill="#D9D5D0"/><g class="cm-v" style="--x:86px;--y:0px;--d:0.2s"><rect x="100" y="84" width="40" height="44" rx="4" fill="#FFFFFF" stroke="#2A2A30" stroke-width="2"/><rect x="100" y="84" width="40" height="9" rx="3" fill="#C52646"/><rect x="106" y="101" width="28" height="4" rx="2" fill="#D9D5D0"/><rect x="106" y="111" width="20" height="4" rx="2" fill="#D9D5D0"/></g><text class="cm-lb" x="120" y="150" text-anchor="middle">orden</text>
  <text class="cm-lb" x="160" y="192" text-anchor="middle">una orden empaquetada como objeto</text>
</svg>
